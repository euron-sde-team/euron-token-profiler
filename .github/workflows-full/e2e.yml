name: e2e

# The full stack on the Floci AWS emulator: Terraform provisions the models bucket, KMS and
# Secrets Manager, the demo seed installs models, creates keys and a week of traffic, then
# Playwright drives the web app and the QA crawl checks every page at desktop and mobile
# widths with axe.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-floci:
    name: end-to-end on Floci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: docker/setup-buildx-action@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tokenprofiler/e2e exec playwright install --with-deps chromium
      - name: Stack up and demo data
        run: make up demo
      # Screenshots first, so they show the demo data and not what the other suites add.
      - name: Screenshots
        run: make screenshots
      - name: Browser tests
        run: make e2e
      - name: QA crawl (desktop and mobile, axe)
        run: make qa
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/.qa
      - name: Stack logs on failure
        if: failure()
        run: docker compose -p tokenprofiler logs --tail 200

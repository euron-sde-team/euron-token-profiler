# gitleaks configuration: the default ruleset plus rules for cloud identifiers that are not
# secrets on their own but must never appear in a public repository (they map
# infrastructure and help targeted attacks).
title = "euron-token-profiler"

[extend]
useDefault = true

[[rules]]
id = "aws-account-id-in-arn"
description = "AWS ARN carrying a real 12-digit account id"
regex = '''arn:aws[a-z-]*:[a-z0-9-]+:[a-z0-9-]*:(\d{12}):'''
secretGroup = 1
keywords = ["arn:aws"]
[rules.allowlist]
regexes = ['''^000000000000$''', '''^123456789012$''']

[[rules]]
id = "aws-account-id-labelled"
description = "12-digit number labelled as an AWS account"
regex = '''(?i)(?:account[_ -]?id|aws[_ -]?account|account)["'\s:=]{1,6}(\d{12})\b'''
secretGroup = 1
keywords = ["account"]
[rules.allowlist]
regexes = ['''^000000000000$''', '''^123456789012$''']

[[rules]]
id = "aws-resource-id"
description = "Concrete AWS resource id (AMI, subnet, security group, VPC, ...)"
regex = '''\b((?:ami|subnet|sg|vpc|pcx|rtb|igw|nat|eni|vol|snap|i)-[0-9a-f]{8,17})\b'''
secretGroup = 1
keywords = ["ami-", "subnet-", "sg-", "vpc-", "pcx-", "rtb-", "igw-", "nat-", "eni-", "vol-", "snap-", "i-"]
[rules.allowlist]
regexes = ['''-0{8,17}$''', '''-(?:x+|abc[0-9a-f]*|1234567[0-9a-f]*)$''']

[[rules]]
id = "rds-endpoint"
description = "Concrete RDS endpoint hostname"
regex = '''\b[a-z0-9-]+\.[a-z0-9]{12}\.[a-z0-9-]+\.rds\.amazonaws\.com\b'''
keywords = ["rds.amazonaws.com"]

[[allowlists]]
description = "Documented emulator credentials, example placeholders and visibly fake test values"
regexTarget = "match"
regexes = [
  '''AWS_(ACCESS_KEY_ID|SECRET_ACCESS_KEY)[=:]\s*["']?test["']?''',
  '''(access|secret)_key\s*=\s*"test"''',
  '''replace-with-[a-z0-9-]+''',
  # Visibly fake values in the test suites.
  '''integration-[a-z-]+-0123456789abcdef''',
  '''Integration-pass-2026''',
  # The development default of the session secret, the key pepper and the secret box key
  # (production refuses it at boot), and the demo password of scripts/dev-api.sh.
  '''dev-only-insecure-secret-do-not-use-in-production''',
  '''Demo-tokenprofiler-2026''',
]
paths = [
  '''pnpm-lock\.yaml''',
  '''(^|/)uv\.lock''',
  '''(^|/)node_modules/''',
  '''\.example$''',
]

# Test suites carry made-up tokens (a webhook signing secret to verify against, a pepper).
# Random-looking constants trip the generic rule by entropy alone, so that one rule is
# relaxed for test directories; every specific rule (cloud keys, private keys, vendor
# tokens) still applies there.
[[allowlists]]
description = "Made-up credentials in test directories"
targetRules = ["generic-api-key"]
paths = ['''(^|/)tests?/''']

# The scrubber's unit tests need credential-shaped samples to prove they are masked. The
# JWT in them is the public example from the JWT specification, not a real token.
[[allowlists]]
description = "Specification example JWT used to test credential scrubbing"
targetRules = ["jwt"]
paths = ['''apps/api/tests/unit/test_scrub\.py''']

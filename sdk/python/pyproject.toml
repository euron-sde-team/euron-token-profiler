[project]
name = "tokenprofiler-sdk"
version = "0.1.0"
description = "Python SDK for Euron TokenProfiler: traces, spans and generations with token and cost attribution."
readme = "README.md"
license = "MIT"
authors = [{ name = "ENGAGESPHERE TECHNOLOGY PRIVATE LIMITED" }]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]
keywords = ["llm", "observability", "tracing", "opentelemetry", "tokens", "cost"]

[dependency-groups]
dev = ["pytest>=9.1", "pytest-asyncio>=1.4", "ruff>=0.17", "mypy>=2.4"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenprofiler_sdk"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "SIM", "C4", "RUF", "ASYNC", "PT", "RET", "PIE", "PERF", "TID"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E501", "SIM117"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["tokenprofiler_sdk"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Euron TokenProfiler: local stack (cloud-agnostic base).
#
# Never run this file alone. Pair it with a cloud overlay:
#   make up        # = compose.yaml + compose.floci.yaml  (emulated AWS, no account needed)
#   make up-aws    # = compose.yaml + compose.aws.yaml    (real AWS resources)
#
# Secrets come from deploy/compose/.env, generated by `make env`
# (scripts/gen-local-env.sh). They are random, local-only throwaways.
#
# Host ports (override in .env if they clash with something you already run):
#   web 3210   api 8210   postgres 5461   valkey 6421   floci 4621
name: tokenprofiler

x-app-env: &app-env
  # Development mode: the local stack talks to an emulator and links to localhost, both of
  # which production refuses on purpose (Settings.production_problems).
  APP_ENV: development
  TZ: UTC
  LOG_LEVEL: ${TP_LOG_LEVEL:-info}
  LOG_FORMAT: json
  PRODUCT_NAME: ${TP_PRODUCT_NAME:-Euron TokenProfiler}
  NODE_NAME: ${TP_NODE_NAME:-local-node}
  DATABASE_URL: postgresql+asyncpg://tokenprofiler:tokenprofiler@postgres:5432/tokenprofiler
  REDIS_URL: redis://valkey:6379/0
  SESSION_SECRET: ${TP_SESSION_SECRET:?run `make env` first}
  API_KEY_PEPPER: ${TP_API_KEY_PEPPER:?run `make env` first}
  ENCRYPTION_KEY: ${TP_ENCRYPTION_KEY:?run `make env` first}
  CORS_ORIGINS: http://localhost:${TP_WEB_PORT:-3210},http://127.0.0.1:${TP_WEB_PORT:-3210}
  WEB_URL: http://localhost:${TP_WEB_PORT:-3210}
  API_URL: http://localhost:${TP_API_PORT:-8210}
  ARCHIVE_DIR: /data/archive
  # Used only by `tokenprofiler demo seed` (make demo) for the demo accounts.
  DEMO_PASSWORD: ${TP_DEMO_PASSWORD:-}

x-api-image: &api-image
  build:
    context: ../..
    dockerfile: infra/docker/api.Dockerfile
  image: tokenprofiler-api:local

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: tokenprofiler
      POSTGRES_USER: tokenprofiler
      POSTGRES_PASSWORD: tokenprofiler
    ports:
      - "127.0.0.1:${TP_PG_PORT:-5461}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokenprofiler -d tokenprofiler"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Rate limit windows, revoked sessions, worker locks and the dashboard cache. No eviction
  # policy: a revoked session must never be forgotten early.
  valkey:
    image: valkey/valkey:8.1.10-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${TP_REDIS_PORT:-6421}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Ingest endpoints and the control plane API.
  api:
    <<: *api-image
    environment:
      <<: *app-env
      MIGRATE_ON_BOOT: "true"
    ports:
      - "127.0.0.1:${TP_API_PORT:-8210}:8080"
    volumes:
      - archive:/data
    tmpfs:
      - /tmp:uid=10001,gid=10001
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped

  # Evaluates budgets and alert rules, and enforces retention. The health check reads the
  # worker's own metrics endpoint, so it reflects the worker process itself.
  worker:
    <<: *api-image
    command: ["python", "-m", "tokenprofiler.worker"]
    environment:
      <<: *app-env
      WORKER_METRICS_PORT: "9210"
    volumes:
      - archive:/data
    tmpfs:
      - /tmp:uid=10001,gid=10001
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9210/metrics', timeout=2)",
        ]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 3
    depends_on:
      # The API applies the migrations on boot; the worker starts once they are in.
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    image: tokenprofiler-web:local
    environment:
      # The browser calls the API directly, so this is the host-facing address.
      API_URL: http://localhost:${TP_API_PORT:-8210}
      PRODUCT_NAME: ${TP_PRODUCT_NAME:-Euron TokenProfiler}
    ports:
      - "127.0.0.1:${TP_WEB_PORT:-3210}:8080"
    restart: unless-stopped

volumes:
  pgdata:
  archive:
